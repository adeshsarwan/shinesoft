org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Reduces flaky "Cannot snapshot .last_build_id: not a regular file" on Windows
# when the project lives under OneDrive or sync locks files during builds.
org.gradle.vfs.watch=false
# Kotlin incremental compilation breaks on Windows when the project (e.g. E:\) and
# Pub cache (C:\Users\...\Pub\Cache) are on different drives: "this and base files have different roots".
kotlin.incremental=false
android.builtInKotlin=true
android.newDsl=false
