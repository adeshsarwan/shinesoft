android {
    namespace 'com.snapdrama.shortstream'
    compileSdk 36

    defaultConfig {
        applicationId "com.snapdrama.shortstream"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keystoreFile = file("snapdramashort.jks")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword "snapdramashort@123"
                keyAlias "snapdramashort@123"
                keyPassword "snapdramashort@123"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures{
        viewBinding = true
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

